name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check release assets
        run: npm run release:check

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: annual-review-release-assets
          path: dist/annual-review/
          if-no-files-found: error
